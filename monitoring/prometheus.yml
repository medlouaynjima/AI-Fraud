global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "transaction-api"
    static_configs:
      - targets: ["transaction-api:8000"]

  - job_name: "ml-service"
    static_configs:
      - targets: ["ml-service:8001"]

  - job_name: "fraud-consumer"
    static_configs:
      - targets: ["fraud-consumer:8002"]
